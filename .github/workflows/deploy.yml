name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: darkraul79/raulsebastian.es

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 0: Detectar qué ha cambiado para elegir estrategia de deploy
  # ──────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      needs-rebuild: ${{ steps.check.outputs.needs-rebuild }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Comprobar archivos que requieren rebuild
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Archivos cambiados:"
          echo "$CHANGED"

          NEEDS_REBUILD=false
          while IFS= read -r file; do
            case "$file" in
              composer.json|composer.lock|\
              package.json|package-lock.json|\
              docker/*|Dockerfile|\
              docker-compose.yml|\
              vite.config.js|\
              public/images*|public/favicon.ico|\
              resources/css/*|resources/js/*)
                NEEDS_REBUILD=true
                echo "  → Rebuild necesario por: $file"
                ;;
            esac
          done <<< "$CHANGED"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEEDS_REBUILD=true
            echo "  → Rebuild forzado por lanzamiento manual"
          fi

          echo "needs-rebuild=$NEEDS_REBUILD" >> "$GITHUB_OUTPUT"
          echo "Resultado: needs-rebuild=$NEEDS_REBUILD"

  # ──────────────────────────────────────────────────────────────────
  # Job 1: Construir y publicar imagen (solo si hace falta rebuild)
  # ──────────────────────────────────────────────────────────────────
  build-and-push:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-rebuild == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ──────────────────────────────────────────────────────────────────
  # Job 2a: Deploy COMPLETO (imagen nueva)
  # ──────────────────────────────────────────────────────────────────
  deploy-full:
    name: Deploy completo (imagen nueva)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.needs-rebuild == 'true'
    environment: production

    steps:
      # La tailnet evita depender de la IP pública (dinámica) y de puertos abiertos.
      - name: Conectar a la tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy completo en el servidor
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "$DEPLOY_PORT" \
            "$DEPLOY_TARGET" 'bash -s' -- \
            "${{ github.sha }}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" <<'REMOTE'
            # Todo en un bloque: bash lo lee entero antes de ejecutarlo y ningún
            # comando (p. ej. docker compose exec) puede consumir el resto del script.
            {
            set -e

            export APP_VERSION="sha-$(echo "$1" | cut -c1-7)"
            export DOCKER_IMAGE="$2"
            GHCR_USER="$3"
            GHCR_TOKEN="$4"

            if [ ! -d /srv/raulsebastian.es/.git ]; then
              echo "==> Clonando repositorio por primera vez..."
              git clone -b master https://github.com/darkraul79/raulsebastian.es.git /srv/raulsebastian.es
            fi

            cd /srv/raulsebastian.es

            if [ ! -f .env ]; then
              echo "ERROR: Falta .env en /srv/raulsebastian.es — copia .env.production.example como .env"
              exit 1
            fi

            echo "==> Actualizando código fuente..."
            git fetch origin master
            git reset --hard origin/master

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Liberando espacio en disco..."
            docker images --format "{{.Repository}}:{{.Tag}}" | \
              grep "ghcr.io/darkraul79/raulsebastian.es:sha-" | \
              tail -n +3 | \
              xargs -r docker rmi 2>/dev/null || true
            docker image prune -f

            docker compose pull app
            docker compose up -d --no-deps --remove-orphans app nginx

            docker image prune -f

            echo "✅ Deploy COMPLETO: $APP_VERSION"
            } < /dev/null
          REMOTE

  # ──────────────────────────────────────────────────────────────────
  # Job 2b: Deploy RÁPIDO (solo PHP/contenido/markdown, sin rebuild)
  # ──────────────────────────────────────────────────────────────────
  deploy-fast:
    name: Deploy rápido (solo código)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-rebuild == 'false'
    environment: production

    steps:
      # La tailnet evita depender de la IP pública (dinámica) y de puertos abiertos.
      - name: Conectar a la tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy rápido en el servidor
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "$DEPLOY_PORT" \
            "$DEPLOY_TARGET" 'bash -s' <<'REMOTE'
            # Todo en un bloque: bash lo lee entero antes de ejecutarlo y ningún
            # comando (p. ej. docker compose exec) puede consumir el resto del script.
            {
            set -e

            cd /srv/raulsebastian.es

            echo "==> Actualizando código fuente..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> Recargando cachés Laravel en el contenedor..."
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php artisan event:cache

            echo "✅ Deploy RÁPIDO completado en segundos"
            } < /dev/null
          REMOTE
